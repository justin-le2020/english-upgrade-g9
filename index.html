<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>English Upgrade – Grade 9</title>
  <style>
    :root{--ink:#17324d;--muted:#66788a;--line:#dce5ed;--bg:#f6f8fb;--card:#fff;--accent:#244f73}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1f2d3a}
    main{max-width:820px;margin:0 auto;padding:48px 20px}
    .hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 8px 30px rgba(20,45,70,.06)}
    h1{margin:0 0 8px;color:var(--ink);font-size:clamp(30px,5vw,46px)}
    .sub{color:var(--muted);font-size:18px;margin:0 0 24px}
    .card{margin-top:20px}
    .day{display:flex;gap:18px;align-items:center}
    .badge{width:54px;height:54px;border-radius:15px;background:#eaf1f7;display:grid;place-items:center;font-weight:800;color:var(--accent)}
    a.btn{display:inline-block;margin-top:18px;background:var(--accent);color:white;text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:700}
    small{color:var(--muted)}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <h1>English Upgrade</h1>
    <p class="sub">30 minutes a day · Build English you can actually use.</p>
    <small>Student ID: S01 · No full name is stored.</small>
  </section>

  <section class="card">
    <div class="day">
      <div class="badge">D1</div>
      <div>
        <h2 style="margin:0 0 6px">Week 1 · Day 1</h2>
        <div>City Life — Control Your English</div>
      </div>
    </div>
    <a class="btn" href="w1d1-city-life.html">Start lesson</a>
  </section>
</main>
</body>
</html>
